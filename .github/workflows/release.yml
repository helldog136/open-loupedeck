name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: extract
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION="$(grep -m1 '^version' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "tag=$TAG pyproject=$PYPROJECT_VERSION"
          if [ "$TAG" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag v$TAG does not match pyproject.toml version $PYPROJECT_VERSION"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: PyInstaller build
        run: pyinstaller packaging/pyinstaller.spec --noconfirm
      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss /DMyAppVersion=${{ needs.check-version.outputs.version }}
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: packaging/windows/output/*.exe
          if-no-files-found: error

  build-macos:
    needs: check-version
    runs-on: macos-latest
    continue-on-error: true # unsigned/untested packaging path — never block the Windows release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - name: Build .dmg
        run: bash packaging/macos/build_dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: packaging/macos/output/*.dmg
          if-no-files-found: error

  build-linux:
    needs: check-version
    runs-on: ubuntu-latest
    continue-on-error: true # untested packaging path — never block the Windows release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1" # CI runners typically have no working FUSE mount
        run: bash packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: packaging/linux/output/*.AppImage
          if-no-files-found: error

  publish:
    needs: [check-version, build-windows, build-macos, build-linux]
    if: always() && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create needs this explicitly -- the default GITHUB_TOKEN is read-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List downloaded artifacts
        run: ls -la artifacts/
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
